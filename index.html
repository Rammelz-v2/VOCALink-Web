<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocaLink — Teacher Portal</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #2D226A; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: linear-gradient(160deg, #1E1650 0%, #2D226A 55%, #1A3A5F 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.45s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .sp-logo {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: linear-gradient(135deg, #1AADDC, #0DD0F5);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 40px rgba(26,173,220,0.50);
        margin-bottom: 22px;
        animation: sp-pop 0.6s cubic-bezier(.22,1,.36,1) forwards;
      }
      @keyframes sp-pop {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }

      .sp-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 34px;
        font-weight: 800;
        color: #FFFFFF;
        letter-spacing: -0.6px;
        animation: sp-rise 0.55s 0.1s cubic-bezier(.22,1,.36,1) both;
      }
      .sp-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 500;
        color: rgba(255,255,255,0.50);
        letter-spacing: 0.4px;
        margin-top: 7px;
        margin-bottom: 52px;
        animation: sp-rise 0.55s 0.18s cubic-bezier(.22,1,.36,1) both;
      }
      @keyframes sp-rise {
        from { transform: translateY(10px); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
      }

      .sp-dots {
        display: flex;
        gap: 9px;
      }
      .sp-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #1AADDC;
        animation: sp-pulse 1.3s ease-in-out infinite;
        opacity: 0.5;
      }
      .sp-dot:nth-child(2) { animation-delay: 0.2s; }
      .sp-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes sp-pulse {
        0%, 80%, 100% { transform: scale(0.65); opacity: 0.35; }
        40%            { transform: scale(1.1);  opacity: 1;    }
      }

      /* Decorative rings */
      .sp-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(26,173,220,0.12);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <!-- decorative rings -->
      <div class="sp-ring" style="width:260px;height:260px;bottom:-80px;right:-80px;"></div>
      <div class="sp-ring" style="width:180px;height:180px;top:-60px;left:-40px;"></div>

      <!-- logo mark -->
      <div class="sp-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" fill="white"/>
          <circle cx="12" cy="12" r="7" stroke="white" stroke-width="2" fill="none"/>
          <circle cx="12" cy="12" r="10.5" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
        </svg>
      </div>

      <div class="sp-title">VocaLink</div>
      <div class="sp-sub">Your voice matters</div>

      <div class="sp-dots">
        <div class="sp-dot"></div>
        <div class="sp-dot"></div>
        <div class="sp-dot"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
